es", "description": "Implement the approved common technology model, provider migrations, interfaces, security, analytics and ongoing technical support.", "measure": "Proposed: Count approved provider deployments and integrations tested, with baseline metrics and technology performance reports.", "countTarget": null, "unit": "provider deployments", "sourceTargetText": "No numeric deployment or interface target specified; D17-D23 define technology, analytics, implementation and support deliverables.", "sourcePages": "25-32, 52-54", "targetBasis": "not specified"}, {"id": "practice-support", "title": "Deliver shared practice support", "description": "Provide the approved service portfolio for care management, Advanced Primary Care Management, billing, documentation, quality improvement and practice transformation.", "measure": "Proposed: Track services made available, participating practices using them and provider-specific transformation plans completed.", "countTarget": null, "unit": "service and practice deliverables", "sourceTargetText": "No numeric service-use or practice target specified; D24-D29 define the service portfolio, APCM framework, care-management model and utilization reports.", "sourcePages": "32-37, 54-55", "targetBasis": "not specified"}, {"id": "accountable-care-pathways", "title": "Prepare accountable-care participation pathways", "description": "Assess feasible accountable-care options and prepare implementation, affiliation and payer-alignment arrangements for participating providers.", "measure": "Proposed: Track pathway assessment, implementation roadmap, affiliation framework and payer-alignment strategy completed.", "countTarget": null, "unit": "planning deliverables", "sourceTargetText": "No numeric participation or savings target specified; D30-D32 and D39-D40 define accountable-care and contracting deliverables.", "sourcePages": "37-39, 55-56, 58", "targetBasis": "not specified"}, {"id": "financial-sustainability", "title": "Establish funding controls and sustainability plans", "description": "Develop the financial model, provider-support funding controls, reconciliations and transition strategy to sustain shared services.", "measure": "Proposed: Track the financial model, support-fund plan, reconciliations and sustainability assessments completed.", "countTarget": null, "unit": "financial and sustainability deliverables", "sourceTargetText": "No numeric revenue or sustainability target specified; D33-D38 and D41-D42 define financial and sustainability deliverables.", "sourcePages": "39-44, 56-59", "targetBasis": "not specified"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "Page 47 explicitly makes quantities dependent on participation, State authorization, funding and contract terms; named documents do not establish a numeric provider target.", "Do not assume a new legal CIN, MSO or ACO must be created solely from the solicitation title; use the approved shared-services model and State-directed accountable-care pathways.", "Provider Support Funds are distinct from contractor compensation and its subcontractor/vendor costs (pp.9, 50, 57).", "The technology scope excludes a separate statewide analytics hub (p.26).", "The original RFI gives conflicting estimated start dates (30 October 2026, pp.4-5; 1 October 2026, p.59). Neither establishes the executed contract start.", "Initial estimated start date conflicts within original RFI: October 30, 2026 on pp.4-5; October 1, 2026 on p.59. Both end July 31, 2027. Confirm executed agreement or addendum before presenting a definitive start date."]}, "SHPDA2604": {"sourceFile": "Solicitation SHPDA2604 Final.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/2. Closed opportunities/261005 CQIE/Solicitation SHPDA2604 Final.pdf", "procurementType": "Request for Interest (RFI)", "scopeBasis": "RFI scope", "geography": {"islands": [], "statewide": true, "note": "Statewide HIE/CQIE services, with expanded participation by rural community providers. The RFI does not allocate delivery targets among named islands.", "sourcePages": "10, 26-30"}, "goals": [{"id": "chr-onboarding", "title": "Onboard community-record participants", "description": "Complete training, implementation and support so additional participants can use community health records.", "measure": "Proposed: Count participants whose community-record onboarding, training and implementation are complete.", "countTarget": 75, "unit": "participants", "sourceTargetText": "Engage at least seventy-five (75) participants to complete onboarding activities, including training, implementation and support of CHR during the initial term.", "sourcePages": "26-27, 68-69", "targetBasis": "explicit"}, {"id": "data-suppliers", "title": "Connect new data suppliers", "description": "Recruit eligible data suppliers and complete development, testing, training and support for live data delivery to the exchange.", "measure": "Proposed: Count enrolled participants with tested production data delivery and required full data sharing.", "countTarget": 28, "unit": "participants", "sourceTargetText": "Recruit and enroll at least twenty-eight (28) eligible participants to supply data to the HIE during the initial term; full data sharing is required.", "sourcePages": "27-28, 69", "targetBasis": "explicit"}, {"id": "notification-participants", "title": "Expand electronic notification participation", "description": "Onboard participants to send and receive real-time alerts supporting follow-up and care coordination.", "measure": "Proposed: Count recruited and enrolled notification participants, with testing and production status recorded.", "countTarget": 5, "unit": "participants", "sourceTargetText": "Recruit and enroll at least five (5) participants during the initial term for Electronic Notification Services.", "sourcePages": "30, 69", "targetBasis": "explicit"}, {"id": "core-modernization", "title": "Modernize the exchange infrastructure", "description": "Implement the CQIE modernization plan, platform configuration and standards-based connectivity with documented technical readiness.", "measure": "Proposed: Track modernization activities completed, platform configuration evidence and proof of connection or readiness.", "countTarget": null, "unit": "modernization deliverables", "sourceTargetText": "No fixed modernization or interface count specified; D4.2, D6 and D7 require implementation, completion and technical configuration records.", "sourcePages": "17, 67", "targetBasis": "not specified"}, {"id": "data-quality", "title": "Implement the data-quality improvement program", "description": "Establish data standards, terminology mapping, participant quality workgroups and documented improvement actions.", "measure": "Proposed: Track mapping validation, workgroup outputs, participant findings, improvement actions and quality reports.", "countTarget": null, "unit": "quality-improvement deliverables", "sourceTargetText": "The contractor must identify a target number of providers, types and quality milestones; the RFI does not prescribe that number. D8-D11 define quality deliverables.", "sourcePages": "28-31, 67-68", "targetBasis": "not specified"}, {"id": "exchange-availability", "title": "Maintain reliable exchange access", "description": "Operate the exchange with monitored portal availability, failover and required operational reporting.", "measure": "Proposed: Report monthly authorized-user portal availability, excluding permitted planned downtime.", "countTarget": 99.5, "unit": "percent monthly availability", "sourceTargetText": "Authorized HIE portal access shall be available at least 99.5% of the monthly reporting period, excluding planned maintenance and/or outages.", "sourcePages": "38-41", "targetBasis": "explicit"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "The 75 community-record, 28 data-supplier and 5 notification participant targets are distinct categories and may overlap; do not add them as unique providers.", "Participant targets apply to the initial term; they are not invented 2028 targets.", "New CHR participants must not be charged subscription fees for HIE services in their first year after onboarding (p.27).", "Availability is a recurring service standard, not a one-time output count. The RFI describes SLA levels as approximations, with work-plan details agreed after contract execution (pp.38-40).", "Deliverable payment requires completed, State-approved work and a signed deliverable acceptance form (p.39)."]}, "SHPDA2609": {"sourceFile": "Solicitation SHPDA2609 Final.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/Solicitation SHPDA2609 Final.pdf", "procurementType": "Request for Interest (RFI)", "scopeBasis": "RFI scope", "geography": {"islands": [], "statewide": true, "note": "Statewide SHPDA-approved hospitals and associated care organizations serving rural populations. Hospitals designated through HHSC East Hawaiʻi, West Hawaiʻi or Kauaʻi Regions are excluded; this does not exclude every provider on those islands. No island-specific delivery quantities given.", "sourcePages": "1, 8, 10-12"}, "goals": [{"id": "hospital-modernization", "title": "Modernize hospital digital systems", "description": "Assess participating sites and implement approved EHR, infrastructure, workflow and training improvements with go-live and stabilization records.", "measure": "Proposed: Count approved sites assessed and implementations reaching documented go-live, with unresolved stabilization issues tracked.", "countTarget": null, "unit": "site implementations", "sourceTargetText": "No numeric hospital or implementation target specified; D4-D5 require assessments, plans, testing, go-live checklists and stabilization reports.", "sourcePages": "13-18, 41-42", "targetBasis": "not specified"}, {"id": "hospital-data-exchange", "title": "Enable reliable clinical data exchange", "description": "Implement and test interfaces, validate transmission and receipt, and document hospital exchange and data-quality readiness.", "measure": "Proposed: Count validated interfaces and supported sites exchanging data, with open data-quality issues recorded.", "countTarget": null, "unit": "interfaces", "sourceTargetText": "No numeric interface target specified; D6-D7 require build/testing records, validation materials and quality/data-quality documentation.", "sourcePages": "19-21, 42", "targetBasis": "not specified"}, {"id": "hospital-analytics", "title": "Turn hospital data into improvement plans", "description": "Deliver approved hospital analyses, practical action plans, training and follow-up findings using available, suitable data.", "measure": "Proposed: Track analytic products, action plans and feasible follow-up analyses completed.", "countTarget": null, "unit": "analytic and action-plan deliverables", "sourceTargetText": "No numeric analysis or outcome target specified; D10-D17 define analytic plans, products, action plans, knowledge transfer and sustainability outputs.", "sourcePages": "24-30, 42-43", "targetBasis": "not specified"}, {"id": "hospital-readiness", "title": "Prepare hospitals for payment transformation", "description": "Assess hospital readiness and develop tailored transformation plans, technical support and sustainability recommendations for voluntary participation.", "measure": "Proposed: Track hospitals assessed and hospital-specific implementation plans and readiness milestones completed.", "countTarget": null, "unit": "hospital readiness plans", "sourceTargetText": "No numeric hospital participation target specified; D19-D27 define engagement, readiness assessment, transformation and transition outputs.", "sourcePages": "30-38, 43-44", "targetBasis": "not specified"}, {"id": "hospital-fund-controls", "title": "Document readiness funding and its use", "description": "Establish approved funding processes and maintain award documentation, expenditure reconciliation and required financial reporting.", "measure": "Proposed: Track funding-cycle documentation, approved allocations, obligations, expenditure, balances and reconciliation reports.", "countTarget": null, "unit": "funding administration deliverables", "sourceTargetText": "No numeric award or disbursement target specified; D18 defines fund-administration materials; monthly reporting includes budget-to-actual spending and funding distributed/obligated.", "sourcePages": "31-32, 39-40, 43", "targetBasis": "not specified"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "The RFI has three formal scope areas; the five dashboard goals are editorial groupings of their deliverables.", "The EHR replacement cap conflicts: $3.9m on p.5 versus $3.5m on p.18; clarification is needed. Neither is an output target.", "The 50-member relationship requirement on p.47 is a bidder qualification, not a goal to serve 50 hospitals.", "Statewide ATA Hub design/development is outside this contractor scope (p.25).", "Funding must supplement rather than replace existing obligations or previously budgeted work (p.56).", "Original RFI EHR replacement limit is inconsistent: $3.9m p.5 versus $3.5m p.18. Neither cap should be presented as settled without addendum or executed agreement."]}, "SHPDA2610": {"sourceFile": "SHPDA2610 FQHC Final.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/SHPDA2610 FQHC Final.pdf", "procurementType": "Request for Interest (RFI)", "scopeBasis": "RFI scope", "geography": {"islands": [], "statewide": true, "note": "Statewide participating FQHCs and their operated or affiliated delivery sites. No named-island allocation or fixed site count is established.", "sourcePages": "1, 8-10"}, "goals": [{"id": "fqhc-modernization", "title": "Modernize FQHC digital systems", "description": "Assess FQHC readiness and implement approved EHR, workflow and infrastructure improvements with testing, training and stabilization records.", "measure": "Proposed: Count FQHC sites assessed and documented implementations, migrations and go-live events completed.", "countTarget": null, "unit": "site implementations", "sourceTargetText": "The RFI is intended for up to fourteen (14) FQHC provider community clinics. This is the eligible scope ceiling, not a required number of completed implementations. D4-D5 require site assessments, implementation plans, tests, go-live checklists and stabilization reports; no fixed implementation output count is specified.", "sourcePages": "8, 11-15, 34-35", "targetBasis": "not specified"}, {"id": "fqhc-data-exchange", "title": "Connect FQHCs to clinical data exchange", "description": "Implement and test approved interfaces and document CQIE/HHIE connectivity and data-quality readiness.", "measure": "Proposed: Count tested interfaces, validated data exchanges and completed data-quality actions.", "countTarget": null, "unit": "interfaces", "sourceTargetText": "No numeric interface target specified; D6-D7 define interface, exchange-validation and quality-reporting deliverables.", "sourcePages": "15-17, 35", "targetBasis": "not specified"}, {"id": "fqhc-analytics", "title": "Deliver FQHC analytics and action plans", "description": "Develop useful FQHC analyses, practical improvement plans, training and follow-up findings from available data.", "measure": "Proposed: Track approved analytic products, action plans and feasible follow-up analyses completed.", "countTarget": null, "unit": "analytic and action-plan deliverables", "sourceTargetText": "No numeric analysis or outcome target specified; D10-D17 define analytic plans, products, action plans and knowledge-transfer outputs.", "sourcePages": "20-25, 35-36", "targetBasis": "not specified"}, {"id": "fqhc-readiness", "title": "Prepare FQHCs for new payment models", "description": "Assess readiness and develop FQHC-specific plans, technical assistance and sustainable pathways for voluntary payment transformation.", "measure": "Proposed: Track FQHC readiness assessments, transformation plans and completed implementation milestones.", "countTarget": null, "unit": "FQHC readiness plans", "sourceTargetText": "The eligible scope is up to fourteen (14) FQHC provider community clinics; participation is voluntary and subject to SHPDA approval. D19-D27 require engagement, readiness assessment, transformation and transition outputs, with no fixed completed-readiness-plan count specified.", "sourcePages": "8, 25-31, 36-38", "targetBasis": "not specified"}, {"id": "fqhc-fund-controls", "title": "Document readiness funding and its use", "description": "Administer State-directed readiness funding with approved processes, financial controls, expenditure records and reporting.", "measure": "Proposed: Track funding-cycle materials, approved awards, expenditure records, reconciliations and required reports.", "countTarget": null, "unit": "funding administration deliverables", "sourceTargetText": "No numeric funding-award target specified; D18 requires fund-administration materials, with financial oversight described in the scope.", "sourcePages": "10, 25-26, 31-33, 36", "targetBasis": "not specified"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "The RFI has three formal scope areas; the five dashboard goals are editorial groupings.", "The deliverable table gives SHPDA estimated cadence; the contractor must propose its timeline and specify delivery years (p.33).", "EHR replacement is capped at $3.6m, distinct from other modernization work and not an output count (pp.5, 14-15).", "The analytics scope excludes development of data infrastructure or a centralized statewide analytics platform (p.20).", "Planning and assessment must be distinguished from actual implementation, go-live and stabilization (pp.13-14).", "The RFI expressly covers up to 14 FQHC provider community clinics (p.8). This is an eligible scope ceiling; it is not a promise that 14 sites, implementations or readiness plans will be completed. Keep implementation countTarget null unless a negotiated output target is obtained."]}, "RICA-HTH-730-BP1-PS-911": {"sourceFile": "RICA-HTH-730-BP1-PS-911.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/RICA-HTH-730-BP1-PS-911.pdf", "procurementType": "Request for Interest (RFI)", "scopeBasis": "RFI scope", "geography": {"islands": [], "statewide": true, "note": "Statewide 911 integration across Hawaiʻi, Maui, Kauaʻi and Honolulu counties. The source names counties, not island-level installation allocations; Molokaʻi and Lānaʻi are not separately specified.", "sourcePages": "3, 5-6, 9"}, "goals": [{"id": "call-workstations", "title": "Install NG911 call-taking workstations", "description": "Supply, configure, install and test fully functional call-taking workstations with voice, multimedia, mapping, transcription and recording.", "measure": "Proposed: Count workstations installed, tested and ready for operations.", "countTarget": 5, "unit": "workstations", "sourceTargetText": "Supply, configure, and maintain five (5) fully functional NG911 call-taking workstations.", "sourcePages": "5", "targetBasis": "explicit"}, {"id": "text-to-911", "title": "Integrate Text-to-911 services", "description": "Provide managed SMS Text-to-911 delivery and multiseat licensing integrated with the NG911 workstations.", "measure": "Proposed: Track configured Text-to-911 services and successful end-to-end workstation tests.", "countTarget": null, "unit": "integrated services", "sourceTargetText": "No numeric seat or message target specified; managed SMS Text-to-911 and full workstation integration are required.", "sourcePages": "5-6", "targetBasis": "not specified"}, {"id": "network-build", "title": "Install network and rack infrastructure", "description": "Install required switching, cloud-managed networking, racks, power and grounding components for NG911 operation.", "measure": "Proposed: Count complete installed rack assemblies and verify required network components.", "countTarget": 3, "unit": "network racks", "sourceTargetText": "Install three (3) network racks, each with six (6) power distribution units per rack and required wire management, fans and grounding.", "sourcePages": "6-7", "targetBasis": "explicit"}, {"id": "cabling", "title": "Install and certify horizontal cabling", "description": "Install, terminate, test and document structured cabling and pathways for the approved NG911 design.", "measure": "Proposed: Count horizontal drops installed and certified, with test records and as-built documentation.", "countTarget": 176, "unit": "horizontal drops", "sourceTargetText": "Install, terminate, test, and certify a total of 176 horizontal drops, including two CAT6 cables at each of 88 data locations.", "sourcePages": "6-8", "targetBasis": "explicit"}, {"id": "deployment-handover", "title": "Complete deployment, testing and staff handover", "description": "Deliver a statewide deployment plan with integration, cutover, acceptance testing, training and operational documentation.", "measure": "Proposed: Track approved deployment phases, completed tests, training records and handover documentation.", "countTarget": null, "unit": "deployment deliverables", "sourceTargetText": "No numeric PSAP deployment or training-session target specified; statewide deployment planning, cutover, testing and training are required.", "sourcePages": "4-5, 9", "targetBasis": "not specified"}, {"id": "continuous-support", "title": "Provide continuous monitoring and support", "description": "Monitor and maintain supplied hardware and software, manage escalation and replace equipment under the defined policies.", "measure": "Proposed: Track support coverage and monitoring records, alongside incidents and equipment replacement performance.", "countTarget": 24, "unit": "support hours per day", "sourceTargetText": "Provide continuous technical support twenty-four (24) hours a day, seven (7) days a week, three hundred sixty-five (365) days a year.", "sourcePages": "4, 8", "targetBasis": "explicit"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "The 176-drop clause also requires two CAT6A cables at each wireless-access-point location but gives no access-point count; do not infer an additional numerical total (p.7).", "Rack and cabling designs may change only with State review and approval (p.8).", "Twenty-four-hour support is a recurring service requirement, not a one-time deliverable count.", "Printed pagination says 20 pages but the PDF has 21; references here are one-based PDF page positions."]}, "RICA-HTH-730-BP1-PT-ANS": {"sourceFile": "RICA-HTH-730-BP1-PT-ANS.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/RICA-HTH-730-BP1-PT-ANS.pdf", "procurementType": "Request for Interest (RFI)", "scopeBasis": "RFI scope", "geography": {"islands": [], "statewide": true, "note": "Statewide enterprise platform for routine and disaster medical operations. No island-specific site, agency or deployment quantities are given.", "sourcePages": "1, 4-6, 32"}, "goals": [{"id": "patient-identification", "title": "Implement statewide patient identification and tracking", "description": "Configure universal prehospital patient identifiers, routine and disaster tracking, reconciliation and patient-movement audit trails.", "measure": "Proposed: Track configured identification and tracking workflows validated through approved tests.", "countTarget": null, "unit": "tracking workflows", "sourceTargetText": "No numeric patient-band or workflow count specified; universal patient identification and tracking implementation is required.", "sourcePages": "9-10, 46-47", "targetBasis": "not specified"}, {"id": "alerts-care-coordination", "title": "Enable alerts, transfers and telehealth workflows", "description": "Configure hospital alerts, MEDICOM transfer coordination, secure consultation and closed-loop clinical communications.", "measure": "Proposed: Track hospital-alert, transfer and consultation workflows configured and successfully tested.", "countTarget": null, "unit": "clinical coordination workflows", "sourceTargetText": "No numeric hospital, alert or telehealth-session target specified; configured hospital and MEDICOM workflows are required.", "sourcePages": "10-12, 46", "targetBasis": "not specified"}, {"id": "system-integrations", "title": "Connect EMS, dispatch and hospital systems", "description": "Implement required bidirectional connections to EMS records, HDE and county fire systems, plus authorized CAD and hospital interfaces.", "measure": "Proposed: Count required interfaces implemented and tested, with documentation and reconciliation evidence.", "countTarget": null, "unit": "interfaces", "sourceTargetText": "No fixed interface count specified; required integrations and documentation are listed in the deliverables.", "sourcePages": "13, 17-20, 46", "targetBasis": "not specified"}, {"id": "operational-dashboards", "title": "Deliver operational and disaster coordination dashboards", "description": "Configure MOCC resource visibility and operational, executive and quality-improvement reporting for patient movement and hospital alerts.", "measure": "Proposed: Track configured dashboards and reports validated against approved operational and disaster use cases.", "countTarget": null, "unit": "dashboards and reports", "sourceTargetText": "No numeric dashboard or report target specified; configured MOCC workflows and reporting deliverables are required.", "sourcePages": "12-14, 46, 48", "targetBasis": "not specified"}, {"id": "deployment-training", "title": "Test, deploy and train users", "description": "Complete system, integration, security and recovery testing, go-live readiness and user and trainer training.", "measure": "Proposed: Track approved test evidence, go-live readiness, production deployment and delivered training materials.", "countTarget": null, "unit": "deployment and training deliverables", "sourceTargetText": "No fixed user or training-hours target specified; testing, deployment, train-the-trainer and training deliverables are required.", "sourcePages": "32-34, 47-48", "targetBasis": "not specified"}, {"id": "system-availability", "title": "Maintain platform availability and support", "description": "Operate the secure cloud platform with continuous monitoring, critical-issue support and service-level reporting.", "measure": "Proposed: Report service availability excluding State-approved scheduled maintenance and document operational support performance.", "countTarget": 99.9, "unit": "percent availability", "sourceTargetText": "Maintain a minimum system availability of 99.9%, excluding scheduled maintenance approved by the State; support 24/7/365 operations.", "sourcePages": "26-29, 48", "targetBasis": "explicit"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "Availability is a recurring service level; p.27 does not specify its measurement period. Do not silently label it monthly.", "Functional requirements describe capabilities, not fixed numbers of hospitals, patients, interfaces or clinical outcomes.", "The RFI expressly says neither State nor respondents have obligations under the RFI itself (p.63).", "Printed pagination says 63 pages but the PDF has 64; references here are one-based PDF page positions."]}, "RICA-HTH-730-BP1-EMSCAD": {"sourceFile": "RICA-HTH-730-BP1-EMSCAD.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/RICA-HTH-730-BP1-EMSCAD.pdf", "procurementType": "Request for Interest (RFI)", "scopeBasis": "RFI scope", "geography": {"islands": [], "statewide": true, "note": "Statewide integrated dispatch and medical communications, supporting EMS, community paramedicine, interfacility and ground/air transport. No named-island deployment allocation given.", "sourcePages": "1, 4-7"}, "goals": [{"id": "cad-deployment", "title": "Deploy the integrated dispatch platform", "description": "Configure production and test CAD environments, call-taking, dispatch and transfer coordination, with operating documentation.", "measure": "Proposed: Track configured environments, workflow tests and final implementation acceptance records.", "countTarget": null, "unit": "platform deployment deliverables", "sourceTargetText": "No numeric deployment count specified; configured CAD production and test platform plus operating documentation are required.", "sourcePages": "4-8, 17, 19", "targetBasis": "not specified"}, {"id": "cad-integrations", "title": "Maintain CAD interoperability", "description": "Maintain the multi-CAD environment and required compatibility with EMS records and bidirectional HDE data exchange.", "measure": "Proposed: Count maintained CAD integrations and verify transaction fidelity through test scripts and data checks.", "countTarget": 8, "unit": "CAD integrations", "sourceTargetText": "Maintain Eight CAD to CAD / Multi CAD environment; maintain CAD integrations.", "sourcePages": "13, 19", "targetBasis": "explicit"}, {"id": "triage-pathways", "title": "Implement triage and alternative-care workflows", "description": "Configure triage protocols, warm transfers, transport scheduling and auditable alternative-care referral pathways.", "measure": "Proposed: Track validated triage scenarios, documented referral workflows and agency-agreed clinical validation results.", "countTarget": null, "unit": "triage and referral workflows", "sourceTargetText": "No numerical reduction target specified; validate safe/unsafe-to-hold scenarios and clinical triage against an agency-agreed metrics plan.", "sourcePages": "8-13, 19", "targetBasis": "not specified"}, {"id": "dispatch-analytics", "title": "Deliver dispatch and patient-outcome dashboards", "description": "Provide determinant analytics, queue-policy lists, high-utilizer profiles, care outcomes and disaster-operations views.", "measure": "Proposed: Track approved dashboards and underlying data reconciliation, including longitudinal patient visibility.", "countTarget": null, "unit": "dashboards", "sourceTargetText": "No numeric dashboard or outcome-improvement target specified; required dashboard categories are listed as deliverables.", "sourcePages": "13-14, 19", "targetBasis": "not specified"}, {"id": "operator-training", "title": "Train operators and maintain their skills", "description": "Deliver initial individualized in-person training and learning materials, followed by annual virtual training and best-practice sessions.", "measure": "Proposed: Record initial in-person training hours; separately track annual virtual training hours and annual best-practice hours.", "countTarget": 40, "unit": "initial in-person training hours", "sourceTargetText": "In-person forty (40) hours individualized training; at least forty (40) hours virtual training annually and at least forty (40) hours annual best-practice sessions.", "sourcePages": "17-18", "targetBasis": "explicit"}, {"id": "cad-service-levels", "title": "Maintain reliable and responsive dispatch services", "description": "Provide high-availability production services, rapid dispatch transactions, continuous support and incident-response reporting.", "measure": "Proposed: Report monthly availability, transaction latency and incident-response times against the stated service levels.", "countTarget": 99.99, "unit": "percent monthly availability", "sourceTargetText": "Minimum monthly system availability 99.99%, excluding approved maintenance; call-taker action to unit notification must not exceed one second under normal conditions.", "sourcePages": "16-17", "targetBasis": "explicit"}], "caveats": ["Goal titles, descriptions and proposed measures are editorial summaries of the saved RFI scope. The RFI is not an executed agreement; negotiated scope, quantities, amendments and acceptance terms have not been verified.", "The training specification contains three separate requirements: 40 initial in-person hours, at least 40 annual virtual hours, and at least 40 annual best-practice hours; 40 is not the combined total.", "Additional explicit response standards: Priority 1 within one hour, Priority 2 within four hours, Priority 3 within one business day (p.17).", "Availability and response targets are recurring service levels, not one-time output counts.", "Research percentages on p.8 are external study findings, not Hawaiʻi performance targets. Triage thresholds on p.10 are configurable clinical classification thresholds, not promised outcome reductions.", "Optional programmatic module features on p.18 must not be treated as committed scope without selection evidence.", "The RFI expressly says neither State nor respondents have obligations under the RFI itself (p.31).", "Printed pagination says 31 pages but the PDF has 32; references here are one-based PDF page positions."]}, "RICA-HTH-730-BP1-MSS": {"sourceFile": "260928 RICA-HTH-730-BP1-MSS.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/2. Cl imulators with the specified accessories for landmark-based and ultrasound-guided central-line training.", "measure": "Central-line systems delivered and accepted", "countTarget": 4, "unit": "systems", "sourceTargetText": "Central line training system; quantity: four (4).", "sourcePages": "5, 8-9, 11", "targetBasis": "explicit"}, {"id": "lifecycle-support", "title": "Provide repair, documentation and technical support", "description": "Provide operating documentation and technical support, and perform manufacturer-authorized maintenance or refurbishment when requested by the State.", "measure": "Required documentation supplied and requested service work documented and tested", "countTarget": null, "unit": "support/service acceptance", "sourceTargetText": "The Provider shall provide maintenance and refurbishment services for the proposed system, as requested by the State; upon completion, furnish service and testing documentation.", "sourcePages": "7, 10-11", "targetBasis": "not specified"}], "caveats": ["These goals summarize the saved RFI scope, not the executed award contract; no actual delivery or completion is established.", "Observable measures are dashboard proposals derived from the cited requirements; null targets mean no separate numeric target is specified for that grouped output.", "Additional consumable and service purchases are conditional on actual needs and funding; the initial four-package quantity is not a lifetime consumables limit.", "These are simulation-equipment outputs; the RFI does not set a number of healthcare staff to be trained or clinical outcomes."]}, "RICA-HTH-730-BP1-MDCV": {"sourceFile": "RICA-HTH-730-BP1-MDCV.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/RICA-HTH-730-BP1-MDCV.pdf", "procurementType": "RFI (Request for Interest)", "scopeBasis": "RFI scope", "geography": {"islands": ["Hawaiʻi"], "statewide": false, "note": "The RFI explicitly specifies deployment on the Island of Hawaiʻi, shipment to H Interest (federal grant source selection)", "scopeBasis": "RFI Section 3, Scope of Work IV.1–7 and deliverable table D1–D7, PDF pp. 10–13.", "geography": {"islands": [], "statewide": true, "note": "The RFI requires a statewide Independent Physician Incubator and a neighbor-island specialty referral system; no island-specific deployment or participation targets are stated. Background shortages are not service allocations.", "sourcePages": "9–11"}, "goals": [{"id": "physician-network", "title": "Coordinate the independent physician network", "description": "Develop and implement the statewide strategic plan and establish an Independent Physicians Council for shared resources, education and purchasing.", "measure": "Strategic plan delivered and council operating with documented activities", "countTarget": null, "unit": "plan and council", "sourceTargetText": "Statewide Strategic Plan (D1, quarterly); Independent Physician Council (D5, monthly); no numeric participation target.", "sourcePages": "10–11, 13", "targetBasis": "not specified"}, {"id": "practice-training", "title": "Provide independent-practice training", "description": "Establish the incubator and develop modules covering billing, practice management, technology, insurance and patient-centered care.", "measure": "Training modules delivered and physicians completing support activities", "countTarget": null, "unit": "modules and participating physicians", "sourceTargetText": "Independent Physician Incubator (D2, quarterly); no numeric module or physician target.", "sourcePages": "10–11, 13", "targetBasis": "not specified"}, {"id": "specialty-referrals", "title": "Build specialty referral connections", "description": "Develop the neighbor-island and specialty-care referral system connecting primary care physicians with specialists, hospitals and clinics.", "measure": "Referral system operating and referral connections established", "countTarget": null, "unit": "referral system and connections", "sourceTargetText": "Neighbor Island Specialty Care Physician Referral System (D3, quarterly); no numeric referral target.", "sourcePages": "11, 13", "targetBasis": "not specified"}, {"id": "post-discharge-care", "title": "Coordinate care after hospital discharge", "description": "Implement a care-management system with assessments, personalized plans, service coordination, education and progress monitoring.", "measure": "Care-management system implemented and patient care plans documented", "countTarget": null, "unit": "system and care plans", "sourceTargetText": "Comprehensive Care Management System (D4, quarterly); no numeric patient or care-plan target.", "sourcePages": "11, 13", "targetBasis": "not specified"}, {"id": "training-center", "title": "Equip the physician office and training center", "description": "Provide a fully equipped venue where physicians can treat patients, train and coordinate incubator activities.", "measure": "Office and training center equipped and available for its stated functions", "countTarget": null, "unit": "operational facility", "sourceTargetText": "Physician Office and Training Center (D6, quarterly); no numeric capacity target.", "sourcePages": "11, 13", "targetBasis": "not specified"}, {"id": "progress-reporting", "title": "Report implementation and spending", "description": "Submit monthly status reports, participate in quarterly reviews and prepare annual and requested summaries.", "measure": "Required status reports and program reviews completed", "countTarget": null, "unit": "reports and reviews", "sourceTargetText": "D7 Monthly Status Reporting; quarterly reviews and annual summary also required; total report count depends on the actual contract term.", "sourcePages": "12–13", "targetBasis": "not specified"}], "caveats": ["Goals summarize source-defined work. Measures are proposed dashboard observations, not evidence of completion or negotiated award targets. Page references are one-based PDF pages.", "The source is an RFI, not the executed Kuakini agreement or approved work plan.", "The RFI contains conflicting estimated start dates: October 30, 2026 on pp. 3–4 and October 1, 2026 on p. 13; no timeline is inferred here.", "No source numeric targets for physicians, training completions, referrals or patients were identified."]}, "HTH-PHN-1-26": {"sourceFile": "260922 HTH-PHN-1-26 RICA-CHW.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/2. Closed opportunities/260922 HTH-PHN-1-26 RICA-CHW.pdf", "procurementType": "Request for Proposals", "scopeBasis": "Later CHW procurement RFP, Section 2.4, especially administrative standards and jointly tracked outputs on PDF pp. 28–35; not the earlier CHW consultation.", "geography": {"islands": ["Hawaiʻi", "Maui", "Molokaʻi", "Lānaʻi", "Kauaʻi", "Oʻahu"], "statewide": true, "note": "Explicit allocation: Maui County 2.0 FTE including Lānaʻi and Molokaʻi; Hawaiʻi County 2.0 FTE (East/West); Kauaʻi 1.0 FTE; rural Oʻahu 1.0 FTE (Waiʻanae and Mākaha). Statewide refers to targeted rural operations, not universal island coverage.", "sourcePages": "20, 29"}, "goals": [{"id": "chw-deployment", "title": "Deploy and support community health workers", "description": "Recruit, train, equip and maintain the allocated CHW workforce under DOH Public Health Nursing field direction.", "measure": "Operational CHW FTE deployed in assigned rural areas", "countTarget": 6, "unit": "CHW full-time equivalents", "sourceTargetText": "Maintain 100% operational CHW staffing capacity (6.0 FTEs); 45-day vacancy grace period per position; at least 0.5 FTE Project Manager separately required.", "sourcePages": "28–32", "targetBasis": "explicit"}, {"id": "direct-encounters", "title": "Deliver direct community encounters", "description": "Support and document direct participant interactions under PHN-led care and outreach assignments.", "measure": "Direct encounters logged per 1.0 FTE CHW per month", "countTarget": 20, "unit": "encounters per 1.0 FTE CHW per month", "sourceTargetText": "Capacity target of 20 direct encounters per 1.0 FTE CHW per month; jointly tracked with DOH PHNB.", "sourcePages": "27, 32", "targetBasis": "explicit"}, {"id": "community-outreach", "title": "Support community outreach events", "description": "Log CHW participation in community outreach events or listening sessions for each PHNB section.", "measure": "Community events or listening sessions supported per PHNB section per month", "countTarget": 2, "unit": "events per PHNB section per month", "sourceTargetText": "At least 2 community events or listening sessions per PHNB section per month.", "sourcePages": "32–33", "targetBasis": "explicit"}, {"id": "referral-follow-up", "title": "Initiate and track referral follow-up", "description": "Attempt outreach and status checks after referrals and record final disposition while distinguishing external waitlists and client readiness.", "measure": "Percentage of referrals with follow-up initiated within 14 calendar days", "countTarget": 70, "unit": "percent of referrals", "sourceTargetText": "70% or higher referral follow-up initiation within 14 calendar days; final resolution status captured within 30 to 60 calendar days.", "sourcePages": "33", "targetBasis": "explicit"}, {"id": "tracking-platform", "title": "Keep the performance tracking platform available", "description": "Deploy and maintain secure tracking of encounters, demographics, events and referral milestones with DOH access.", "measure": "Operational uptime of the secure performance tracking platform", "countTarget": 99, "unit": "percent uptime", "sourceTargetText": "99% or higher operational uptime.", "sourcePages": "28, 31–32", "targetBasis": "explicit"}, {"id": "program-reporting", "title": "Deliver program and financial reports", "description": "Submit expenditure invoices, phased progress reports and the final nine-month evaluation with required output data.", "measure": "Percentage of reports and invoices submitted on time", "countTarget": 100, "unit": "percent of required submissions", "sourceTargetText": "100% of required expenditure invoices, progress and evaluation reports on or before the 10th calendar day of each designated month, with zero material accounting discrepancies.", "sourcePages": "29, 32, 34–35", "targetBasis": "explicit"}], "caveats": ["Goals summarize source-defined work. Measures are proposed dashboard observations, not evidence of completion or negotiated award targets. Page references are one-based PDF pages.", "The RFP separates contractor administrative accountability from DOH PHN clinical and programmatic responsibility; encounters, events and referral measures are jointly tracked rather than solely attributable to HIPHI.", "Recurring rates are not total contract counts; do not multiply by assumed operating months or convert FTE to employee headcount.", "Scope p. 33 says 70% or higher referral initiation; evaluation wording p. 49 says over 70%. The extracted target follows the service specification and retains the wording.", "The RFP also requires at least 60% of documented interactions to serve high-risk rural residents (p. 33), equipment for all deployed CHWs, monthly peer support and protected administrative time; the six goals are a concise selection, not the full compliance specification."]}, "ASO-EOA-27-067": {"sourceFile": "260904 Rev RFP_Act 249_EOA-27-067_KupunAloha_30July2026_post 3Aug2026.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/2. Closed opportunities/260904 Rev RFP_Act 249_EOA-27-067_KupunAloha_30July2026_post 3Aug2026.pdf", "procurementType": "Revised Request for Proposals", "scopeBasis": "Revised KupunAloha RFP Section 2 service specifications and scope, PDF pp. 23–36.", "geography": {"islands": ["Oʻahu"], "statewide": false, "note": "The pilot purpose and geographic service clause explicitly specify Oʻahu. Page 28 mentions volunteer recruitment across all islands, which does not expand the pilot service area.", "sourcePages": "23–24, 28"}, "goals": [{"id": "intake-care-plans", "title": "Assess needs and prepare care plans", "description": "Operate intake, determine eligibility, assess participants at home and prepare individualized plans of care with documented referrals for ineligible people.", "measure": "Completed eligibility assessments, care plans and documented referral handoffs", "countTarget": null, "unit": "assessments, care plans and referrals", "sourceTargetText": "No numeric participant, assessment or care-plan target; the 25,000 statewide estimate is background population need, not a contract target.", "sourcePages": "22–24, 27", "targetBasis": "not specified"}, {"id": "coordinated-home-care", "title": "Deliver coordinated in-home support", "description": "Coordinate licensed agencies, family caregivers and volunteers using task-based scheduling, supervision and electronic visit verification.", "measure": "Service tasks completed and verified against participant care plans", "countTarget": null, "unit": "completed service tasks", "sourceTargetText": "No numeric service-task target; required reporting includes number and percentage of completed tasks.", "sourcePages": "27–28, 36", "targetBasis": "not specified"}, {"id": "volunteer-support", "title": "Recruit and train volunteer caregivers", "description": "Recruit, screen, train, match and supervise volunteers for permitted support tasks with clear clinical boundaries and escalation procedures.", "measure": "Volunteers screened, trained, matched and supported for service", "countTarget": null, "unit": "volunteers ready for assigned service", "sourceTargetText": "No numeric volunteer or training-completion target.", "sourcePages": "28–29, 31–32", "targetBasis": "not specified"}, {"id": "care-technology", "title": "Provide shared care-coordination tools", "description": "Maintain secure technology for care plans, scheduling, visit verification, communication, credentialing and referral tracking.", "measure": "Required platform functions and se otiated participant or volunteer target is established by this RFP.", "The file name refers to Act 249 while the body refers to Act 246; this extraction uses the actual scope text and does not resolve that discrepancy."]}, "RH27-002SK": {"sourceFile": "Approved_RH27-002SK_7-29-2026.pdf", "sourceRelativePath": "01. Partner pack/RHTP/Consortium/1. RFX/3. Awards/Approved_RH27-002SK_7-29-2026.pdf", "procurementType": "Approved restrictive purchase of service request (SPO-H 500)", "scopeBasis": "Description of services on PDF p. 1 and scope-linked implementation requirements on p. 2; approval conditions on p. 4.", "geography": {"islands": ["Hawaiʻi"], "statewide": false, "note": "The notice explicitly specifies Hawaiʻi County; the recipient office address is not used as service geography.", "sourcePages": "1–2"}, "goals": [{"id": "respite-beds", "title": "Open and operate medical respite beds", "description": "Establish and operate a facility or multiple facilities totaling 40 respite beds in Hawaiʻi County for medically fragile people without a safe recovery setting.", "measure": "Medical respite beds operational and accepting eligible residents", "countTarget": 40, "unit": "medical respite beds", "sourceTargetText": "A 40-bed medical respite facility, or multiple facilities totaling 40 medical respite beds.", "sourcePages": "1–2", "targetBasis": "explicit"}, {"id": "clinical-support", "title": "Provide supervised recovery care", "description": "Deliver short-term residential care with on-site nursing supervision, medication management and behavioral-health coordination.", "measure": "Residents receiving documented nursing, medication and coordinated recovery services", "countTarget": null, "unit": "residents receiving recovery services", "sourceTargetText": "No numeric resident-volume or care-encounter target stated.", "sourcePages": "1", "targetBasis": "not specified"}, {"id": "care-referrals", "title": "Maintain hospital and community care connections", "description" utions, Inc. — Corporate profile identifying headquarters", "url": "https://www.eso.com/news/press-releases/eso-appoints-joy-brown-to-board-of-directors/"}], "basis": "This award names two separate companies. Pulsara’s published contact address is Bozeman, Montana; ESO’s headquarters is Austin, Texas. The display preserves both organizations rather than assigning a single joint-company location.", "verifiedDate": "2026-10-14", "locations": [{"display": "Bozeman, Montana", "kind": "office address", "sources": [{"title": "Pulsara — Contact", "url": "https://www.pulsara.com/contact"}], "basis": "Pulsara’s current official contact page lists Bozeman, Montana. The address is presented as a contact address, so it is not promoted to a current headquarters claim.", "verifiedDate": "2026-10-14", "organization": "CommuniCare Technology, Inc. (dba Pulsara)"}, {"display": "Austin, Texas", "kind": "headquarters", "sources": [{"title": "ESO — Contact", "url": "https://www.eso.com/contact-us/"}, {"title": "ESO Solutions, Inc. — Corporate profile identifying headquarters", "url": "https://www.eso.com/news/press-releases/eso-appoints-joy-brown-to-board-of-directors/"}], "basis": "The current official contact page lists Austin, Texas; ESO’s official corporate profile explicitly identifies Austin as its headquarters and identifies the company as ESO Solutions, Inc.", "verifiedDate": "2026-10-14", "organization": "ESO Solutions, Inc."}]}}, "RICA-HTH-730-BP1-EMSCAD": {"bio": {"text": "ESO develops software and data tools for emergency services, fire agencies and hospitals. Its EMS offerings include patient care documentation, computer-aided dispatch, fleet operations, scheduling and billing, while hospital products support clinical information exchange and reporting.", "sources": [{"title": "ESO emergency response software", "url": "https://www.eso.com/"}, {"title": "ESO EMS platform", "url": "https://www.eso.com/ems/"}, {"title": "ESO hospital interoperability", "url": "https://www.eso s/awards/award-details/184507", "checked": "14 Oct 2026", "note": "Awardee, award date and full original award value checked."}, "unresolved": ["No executed agreement or award-specific work plan was reviewed. The live notice establishes the posted period, but the original RFI remains the basis of the detailed output-goal extraction."], "location": {"display": "Honolulu, Hawaiʻi", "city": "Honolulu", "state": "Hawaiʻi", "kind": "office address", "sources": [{"title": "Kuakini official FAQ — location of the system and named subsidiaries", "url": "https://www.kuakini.org/wps/portal/public/About-Us/Frequently-Asked-Questions"}, {"title": "Kuakini Support Services — official subsidiary profile", "url": "https://www.kuakini.org/wps/portal/public/About-Us/Subsidiaries/Kuakini-Support-Services"}], "basis": "Kuakini’s official FAQ explicitly locates Kuakini Health System and its named subsidiaries, including Kuakini Support Services, Inc., at 347 North Kuakini Street, Honolulu, Hawaiʻi 96817. This is the shared campus business address, not an inference from the hospital or the statewide award scope. The site labels this FAQ and subsidiary profile as archived pages.", "verifiedDate": "2026-10-14"}}, "HTH-PHN-1-26": {"bio": {"text": "Hawaiʻi Public Health Institute is a statewide nonprofit that works with communities, government and health care partners. Its programs address prevention, workforce development and public health policy through education, advocacy, technical assistance, coalition building and training.", "sources": [{"title": "About Hawaiʻi Public Health Institute", "url": "https://www.hiphi.org/about/"}], "identityNote": "HIPHI is the public-facing abbreviation of Hawaiʻi Public Health Institute. The award tracker adds the abbreviation; the official site identifies the organization and its statewide nonprofit role."}, "notice": {"kind": "Live official notice", "label": "HANDS award notice", "url": "https://hands.ehawaii.gov/hands/awards/award-details/184463", "checked": "14 Oct 2026", "note": "Awardee, award date and full original award value checked."}, "unresolved": [], "location": {"display": "Honolulu, Hawaiʻi", "city": "Honolulu", "state": "Hawaiʻi", "kind": "office address", "sources": [{"title": "HIPHI About — official contact addresses", "url": "https://www.hiphi.org/about/"}], "basis": "The official HIPHI About page lists its Oʻahu contact office at 707 Richards Street, Suite 300, Honolulu, HI 96813. It also lists a Maui office in Kahului. Neither is explicitly labeled headquarters; Honolulu is used as the primary display location, not an exclusive operating base.", "verifiedDate": "2026-10-14", "additionalOffices": [{"display": "Kahului, Hawaiʻi", "city": "Kahului", "state": "Hawaiʻi", "kind": "office address", "basis": "The same official contact block lists 244 Papa Place, Suite 101, Kahului, HI 96732."}]}}, "ASO-EOA-27-067": {"bio": {"text": "Hoʻokele Care at Home, LLC is an Oʻahu home care agency listed by Hawaiʻi’s Department of Health. Its Ho‘okele Home Care brand provides caregiving for older adults, with caregiver screening, training and coordination intended to support living at home.", "sources": [{"title": "Hawaiʻi Licensed Home Care Agencies — DOH", "url": "https://health.hawaii.gov/ohca/state-licensing-section/hcal/agencies/"}, {"title": "Ho‘okele Home Care — Who We Are", "url": "https://hookelehomecare.com/who-we-are/"}], "identityNote": "DOH lists HOOKELE CARE AT HOME, LLC as license 2-HCA serving Oʻahu at the same Honolulu address and phone as the brand website. HOOKELE CAREGIVERS MAUI, LLC is a separate listed legal entity; do not attribute its Maui license or operations to this awardee."}, "notice": {"kind": "Live official notice", "label": "HANDS award notice", "url": "https://hands.ehawaii.gov/hands/awards/award-details/184442", "checked": "14 Oct 2026", "note": "Awardee, award date and $2.55m full award checked. The $750,000 RHTP share remains tracker-only."}, "unresolved": ["Cover/header use EOA-27-067 but page 2 also says 26-EOA-007. Dashboard award ID ASO-EOA-27-067 comes from tracker. Filename Act 249 differs from text Act 246.", "The complete pilot scope is not partitioned into RHTP-funded versus State-funded deliverables in this RFP. Do not attribute all outputs to the $750,000 share.", "Live notice confirms $2,550,000 total, but the $750,000 RHTP share and RRN assignment remain tracker-only. No primary allocation or amendment was found. Four local 145-page application copies yielded no text matches for KupunAloha, Executive Office on Aging, EOA, $750,000, $1,800,000 or $2,550,000; this negative text search is not proof of absence from all underlying funding records."], "location": {"display": "Honolulu, Hawaiʻi", "city": "Honolulu", "state": "Hawaiʻi", "kind": "office address", "sources": [{"title": "Hawaiʻi DOH — Licensed Home Care Agencies, 2-HCA", "url": "https://health.hawaii.gov/ohca/state-licensing-section/hcal/agencies/"}, {"title": "Ho‘okele Home Care — official contact address", "url": "https://hookelehomecare.com/who-we-are/"}], "basis": "Hawaiʻi DOH’s licensed home care agency roster identifies the exact legal entity HOOKELE CARE AT HOME, LLC (2-HCA) at 820 Mililani Street, Suite 711, Honolulu, Hawaiʻi 96813. The brand’s official website gives the same contact address. HOOKELE CAREGIVERS MAUI, LLC is a separately listed legal entity and is not used to infer this awardee’s base.", "verifiedDate": "2026-10-14"}}, "RH27-002SK": {"bio": {"text": "HOPE Services Hawaiʻi is a nonprofit serving people experiencing homelessness on Hawaiʻi Island. Its work includes outreach, housing support, shelter, behavioral health and medical respite. The organization helps people connect with health care, social services and a place to recover.", "sources": [{"title": "HOPE Services Hawaiʻi — official homepage", "url": "https://hopeserviceshawaii.org/"}, {"title": "HOPE Services — Outreach Programs", "url": "https://hopeserviceshawaii.org/services/outreach-programs/"}], "identityNote": "The official website and source procurement identify HOPE Services Hawaii, Inc. Hawaiian orthography is a display normalization. No affiliation with similarly named organizations outside Hawaiʻi is inferred."}, "notice": {"kind": "Archived official notice export", "label": "HANDS export · 28 Sep 2026", "url": null, "checked": "14 Oct 2026", "note": "Awardee, award date and full original award value checked."}, "unresolved": ["Archived HANDS independently labels the matching amount/date/provider as an award, but its solicitation field is blank. The approval PDF itself authorizes solicitation only. No executed contract or final scope was reviewed."], "location": {"display": "Hilo, Hawaiʻi", "city": "Hilo", "state": "Hawaiʻi", "kind": "office address", "sources": [{"title": "HOPE Services Hawaiʻi — Contact, administrative office", "url": "https://hopeserviceshawaii.org/contact-us/"}], "basis": "HOPE Services Hawaiʻi’s official contact page explicitly labels 357 Waiānuenue Avenue, Hilo, HI 96720 as its administrative office. This is the organization’s public office address, independently of its Hawaiʻi Island service area.", "verifiedDate": "2026-10-14"}}, "RH27-001CA": {"bio": {"text": "Project Vision Hawaiʻi is a nonprofit expanding access to health and human services across the state. Its programs include mobile health screening, housing, homeless outreach and social services, with a focus on people who face barriers to care.", "sources": [{"title": "Project Vision Hawaiʻi — About", "url": "https://www.projectvisionhawaii.org/about"}, {"title": "Project Vision Hawaiʻi — official programs", "url": "https://www.projectvisionhawaii.org/"}], "identityNote": "Official website identifies Project Vision Hawaiʻi, nonprofit EIN 27-2831637. This matches the named provider in the restrictive-purchase request. Statewide organizational work does not expand this specific Kauaʻi award scope."}, "notice": {"kind": "Archived official notice export", "label": "HANDS export · 28 Sep 2026", "url": null, "checked": "14 Oct 2026", "note": "Awardee, award date and full original award value checked."}, "unresolved": ["Archived HANDS independently labels the matching amount/date/provider as an award, but its solicitation field is blank. The approval PDF itself authorizes solicitation only. No executed contract or final scope was reviewed."], "location": {"display": "Honolulu, Hawaiʻi", "city": "Honolulu", "state": "Hawaiʻi", "kind": "office address", "sources": [{"title": "Project Vision Hawaiʻi — About, main office", "url": "https://www.projectvisionhawaii.org/about"}], "basis": "Project Vision Hawaiʻi’s official About page lists its main office contact address as 810 N Vineyard Boulevard, Honolulu, HI 96817. The Kauaʻi location of the RHTP respite project is a separate service geography.", "verifiedDate": "2026-10-14"}}, "RFI-RICA-BHA-BP1-2": {"bio": {"text": "Public Health Supportive Services LLC provides public health and behavioral health technical support to government and community partners. Its stated work includes data analysis, electronic health record workflows, CCBHC payment methodologies, quality reporting and capacity building for health systems.", "sources": [{"title": "Public Health Supportive Services LLC — About", "url": "https://www.phsupport.org/about"}], "identityNote": "The official site explicitly names Public Health Supportive Services LLC (PH-SS), matching the archived HANDS awardee. No headquarters, staff size, Hawaiʻi office or National Council partnership is asserted because these were not independently established here."}, "notice": {"kind": "Archived official notice export", "label": "HANDS export · 28 Sep 2026", "url": null, "checked": "14 Oct 2026", "note": "Awardee, award date and full original award value checked."}, "unresolved": ["RFI does not establish a named island/clinic deployment, a required number of test cases or fixed hours of additional technical assistance. Extra hourly assistance is conditional."], "location": {"display": "Reno, Nevada", "city": "Reno", "state": "Nevada", "kind": "listed business address", "sources": [{"title": "Nevada Purchasing — official statewide contract directory, Public Health Supportive Services", "url": "https://www.purchasing.nv.gov/statewide-contracts/marketing-and-education-consulting-services/"}, {"title": "NevadaEPro — Public Health Supportive Services LLC, primary vendor address", "url": "https://nevadaepro.com/bso/external/purchaseorder/poSummary.sda?docId=99SWC-NV23-17889&external=true&parentUrl=close&releaseNbr=0"}], "basis": "Nevada’s official statewide-contract directory links contract 99SWC-NV23-17889 to NevadaEPro. Its Primary Vendor Information identifies Public Health Supportive Services LLC at a Reno, NV 89521 business address and a phsupport.org contact email. This verifies the listed business contact location, not a designated headquarters or a staffed office. The organization’s own contact page does not publish a city or street address. No Hawaiʻi office is inferred.", "verifiedDate": "2026-10-14", "locationQualifier": "Officially listed business address; headquarters unconfirmed"}}, "RICA-BHA-BP1-1": {"bio": {"text": "Advocates for Human Potential, Inc. works with states, communities and organizations on behavioral health systems. Based in Sudbury, Massachusetts, its services include systems analysis and planning, data-informed decision support, implementation assistance, research and evaluation, and training.", "sources": [{"title": "AHP — About Us", "url": "https://ahpnet.com/about-us/"}, {"title": "AHP — official organizational profile", "url": "https://ahpnet.com/ahp-launches-newly-redesigned-website-with-expanded-access-to-experts-and-services/"}], "identityNote": "The official site footer expands AHP to Advocates for Human Potential, Inc., matching the archived HANDS awardee. No staff count, local Hawaiʻi office, or assumed contract personnel are included."}, "notice": {"kind": "Archived official notice export", "label": "HANDS export · 28 Sep 2026", "url": null, "checked": "14 Oct 2026", "note": "Awardee, award date and full original award value checked."}, "unresolved": ["Five underlying behavioral health programs are evaluation coverage, not five services the evaluator is contracted to operate. Three mobile vans are DOH-BHA background plans, not AHP delivery targets."], "location": {"display": "Sudbury, Massachusetts", "city": "Sudbury", "state": "Massachusetts", "kind": "headquarters", "sources": [{"title": "Advocates for Human Potential — About Us, Corporate Headquarters", "url": "https://ahpnet.com/about-us/"}], "basis": "AHP’s official About Us page explicitly labels 490-B Boston Post Road, Sudbury, MA 01776 as Corporate Headquarters. This is an organizational location, not the service area of its Hawaiʻi evaluation award.", "verifiedDate": "2026-10-14"}}}</script>

<script type="application/json" id="rh-reading-notes">{"RICA-HTH-730-BP1-MSS": ["HANDS contract period: 26 Oct 2026–31 May 2027.", "Additional consumables and services depend on need and funding; the initial four packages are not a lifetime consumables limit.", "Simulation-equipment requirements do not establish staff-training counts or clinical outcome targets."], "SHPDA2604": ["Contract ASO Log #27-095; HANDS period: 30 Oct 2026–31 Jul 2027.", "No island-specific funding allocation is established.", "The 75 CHR, 28 data-supplier and 5 notification participant targets apply to the initial term. Categories may overlap; do not sum them as unique providers or treat them as 2028 targets.", "New CHR participants receive their first year of HIE subscriptions without charge after onboarding (p.27).", "Availability is a recurring service standard. The RFI calls SLA levels approximations; work-plan details are agreed after execution (pp.38–40).", "Deliverable payment requires completed, State-approved work and a signed acceptance form (p.39)."], "RICA 09102026": ["HANDS period: 31 Oct 2026–30 Oct 2027. Earlier RFI estimates differ: 30 Oct 2026–31 Jul 2027 in pp.3–4, with a 1 Oct 2026 start in the p.13 deliverable table.", "The RFI specifies statewide service, while HANDS labels the award Oʻahu. No island-specific allocation is established.", "No numeric physician, training-completion, referral or patient targets were identified."], "HTH-PHN-1-26": ["HANDS period: 28 Oct 2026–31 Jul 2027.", "The award specifies 6.0 FTE CHWs for rural statewide service. The RFP permits full- or part-time positions and requires at least 0.5 FTE project management; FTE is not employee headcount.", "Island labels identify targeted rural service areas, not universal coverage. Maui County includes Molokaʻi and Lānaʻi.", "HIPHI holds administrative accountability; DOH PHN holds clinical and programmatic responsibility. Encounters, events and referrals are jointly tracked, not solely attributable to HIPHI.", "Recurring service rates are not total contract counts; do not multiply them by assumed operating months.", "Referral initiation wording differs: scope p.33 requires 70% or higher; evaluation p.49 says over 70%. The displayed target follows the service specification.", "Additional requirements include at least 60% of documented interactions serving high-risk rural residents, equipment for all deployed CHWs, monthly peer support and protected administrative time (p.33)."], "ASO-EOA-27-067": ["HANDS period: 1 Oct 2026–30 Jun 2027. The revised RFP describes a nine-month pilot without extensions (pp.24, 26).", "Goals cover the complete Oʻahu pilot; no deliverables or participants are allocated to a verified RHTP share.", "Eligibility and program design require EOA approval. The RFP establishes no numeric negotiated participant or volunteer target.", "The filename cites Act 249; the body cites Act 246. Scope summaries follow the body without resolving that discrepancy."], "RICA-HTH-730-BP1-MDCV": ["RFI anticipated period: Aug 2026–31 Jul 2027.", "Four simultaneous treatments is an equipment capability, not a count of patients served or treatments delivered.", "The initial one-day training requirement does not exhaust conditional training for future deployments."], "SHPDA2603": ["Estimated start dates conflict: 30 Oct 2026 on RFI pp.4–5 versus 1 Oct 2026 on p.59; both end 31 Jul 2027. The tracker lists four possible one-year extensions to 31 Jul 2031. The definitive start remains unresolved.", "The RFI combines RHIN and RVBI, although the public webpage groups the notice under RVBI. No initiative funding split is published.", "No island-specific funding allocation is established.", "Quantities depend on participation, State authorization, funding and contract terms; named documents do not establish a numeric provider target (p.47).", "The title does not require creating a new legal CIN, MSO or ACO; scope follows the approved shared-services model and State-directed accountable-care pathways.", "Provider Support Funds are separate from contractor compensation and subcontractor/vendor costs (pp.9, 50, 57).", "A separate statewide analytics hub is outside the technology scope (p.26)."], "RICA-HTH-730-BP1-PS-911": ["Tracker period: Sep 2026–Sep 2027.", "No island-specific funding allocation is established.", "The 176-drop clause also requires two CAT6A cables per wireless access-point location but states no access-point count; no additional total can be inferred (p.7).", "Rack and cabling changes require State review and approval (p.8).", "Twenty-four-hour support is recurring, not a one-time deliverable count.", "Citations use physical PDF pages: 21 pages, although printed pagination says 20."], "SHPDA2609": ["Tracker estimated period: 30 Oct 2026–31 Jul 2027, with four possible one-year extensions to 31 Jul 2031.", "The RFI combines RHIN and RVBI, although the public webpage groups the notice under RVBI. No initiative funding split is published.", "No island-specific funding allocation is established.", "Five dashboard output groups summarize three formal RFI scope areas.", "EHR replacement caps conflict: $3.9m on p.5 versus $3.5m on p.18. Clarification is needed; neither cap is an output target.", "The 50-member relationship requirement is a bidder qualification, not a target to serve 50 hospitals (p.47).", "Statewide ATA Hub design and development are outside this scope (p.25).", "Funding must supplement existing obligations and previously budgeted work, not replace them (p.56)."], "SHPDA2610": ["Tracker estimated period: 30 Oct 2026–31 Jul 2027, with four possible one-year extensions to 31 Jul 2031.", "The RFI combines RHIN and RVBI, although the public webpage groups the notice under RVBI. No initiative funding split is published.", "No island-specific funding allocation is established.", "Five dashboard output groups summarize three formal RFI scope areas. The deliverable cadence is estimated; the contractor must propose timelines and delivery years (p.33).", "The $3.6m EHR-replacement cap is distinct from other modernization work and is not an output count (pp.5, 14–15).", "Data-infrastructure development and a centralized statewide analytics platform are outside the analytics scope (p.20).", "Planning and assessment are separate from implementation, go-live and stabilization (pp.13–14).", "Up to 14 FQHC provider community clinics is an eligible scope ceiling, not a promise of 14 completed sites, implementations or readiness plans. No fixed implementation output count is established (p.8)."], "RICA-HTH-730-BP1-AMBT2": ["RFI anticipated period: Aug 2026–31 Jul 2027. Delivery is separately required within 12 months of contract signature.", "No separate training-day or trainee-count target is stated in the local-support provision.", "Some communications and clinical equipment is State-supplied; provider installation does not mean the provider supplies every component."], "RICA-HTH-730-BP1-MIHA-35": ["RFI anticipated period: Jul 2026–30 Oct 2026.", "Three spaces are specified per vehicle, not three separate mobile clinics.", "The State supplies the satellite subscription and EMS radio; provider scope covers installation as specified.", "No separate numeric training volume is stated in the support requirement."], "RH27-002SK": ["Tracker period: 1 Sep 2026–31 Jul 2027, with possible annual extensions over five years. Renewals depend on funding and satisfactory performance.", "The saved document approves the procurement method and solicitation process only; it is not an RFP (p.4).", "Outcome categories are unquantified; no readmission, housing-placement, occupancy or cost-saving target is established (p.1).", "Existing certification, organizational history and network membership demonstrate provider capability, not new award deliverables.", "The 65.25% Medicaid offset is a budget assumption, not a required savings or collections percentage (p.2)."], "RH27-001CA": ["Tracker period: 1 Sep 2026–31 Jul 2027, with possible annual extensions over five years. Renewals depend on funding and satisfactory performance.", "The saved document approves the procurement method and solicitation process only; it is not an RFP (p.4).", "Outcome categories are unquantified; no readmission, housing-placement, occupancy or cost-saving target is established (p.1).", "Existing certification, organizational history and network membership demonstrate provider capability, not new award deliverables.", "The 65.25% Medicaid offset is a budget assumption, not a required savings or collections percentage (p.2)."], "RICA-HTH-730-BP1-PT-ANS": ["Tracker period: Jul 2026–30 Jul 2027; extendable.", "The recorded award does not allocate amounts between the two awardees.", "No island-specific funding allocation is established.", "Availability is a recurring service level; its measurement period is not specified on p.27 and must not be assumed monthly.", "Functional requirements describe capabilities, not fixed hospital, patient, interface or clinical-outcome counts.", "Citations use physical PDF pages: 64 pages, although printed pagination says 63."], "RICA-HTH-730-BP1-EMSCAD": ["Tracker period: Jul 2026–30 Jul 2027; extendable.", "No island-specific funding allocation is established.", "Training has three separate requirements: 40 initial in-person hours, at least 40 annual virtual hours, and at least 40 annual best-practice hours. Forty is not the combined total.", "Response standards are Priority 1 within one hour, Priority 2 within four hours, and Priority 3 within one business day (p.17). Availability and response targets are recurring service levels, not one-time output counts.", "Research percentages on p.8 are external findings, not Hawaiʻi targets. Triage thresholds on p.10 are configurable clinical classifications, not promised outcome reductions.", "Optional module features are not committed scope without selection evidence (p.18).", "Citations use physical PDF pages: 32 pages, although printed pagination says 31."], "RICA-HTH-730-BP1-AMBT1": ["RFI anticipated period: June–July 2026 through 30 Oct 2026. Delivery is separately required within 12 months of contract signature.", "HANDS lists Kauaʻi, Lānaʻi, Maui and Molokaʻi. The RFI specifies delivery and servicing on Maui and Kauaʻi only; final deployment on Molokaʻi or Lānaʻi is not confirmed.", "No separate training-day or trainee-count target is stated in the support provision.", "Some radio and medical equipment is customer-supplied; installation responsibility does not establish equipment-supply responsibility."], "RICA-HTH-730-BP1-MIHA-38": ["RFI anticipated period: Jul 2026–30 Oct 2026.", "Two training days combine two explicit one-day obligations per delivery island, not two days per vehicle.", "Two exam tables is a per-vehicle equipment quantity, not a patient-throughput target."], "RICA-HTH-730-BP1-RRV-F2": ["RFI anticipated period: Jul 2026–30 Oct 2026.", "The State supplies the land-mobile radio; the provider installs and tests it.", "No separate training-day or trainee-count target is stated in the service provision."], "RICA-HTH-730-BP1-RRV-SUV": ["RFI anticipated period: Jul 2026–30 Oct 2026.", "The State supplies the land-mobile radio; the provider installs and tests it.", "No separate training-day or trainee-count target is stated in the service provision."], "RFI-RICA-BHA-BP1-2": ["Tracker period: 1 Jul 2026–31 Dec 2026; may be extended.", "Four demonstration years require a timeline broken down by year, not four standalone documents.", "Eight-year and five-year experience thresholds and prior statewide needs assessments are contractor qualifications, not deliverable targets.", "The RFI establishes no island-specific or Maui-clinic service commitment; tracker commentary does not establish service geography.", "Additional hourly assistance is conditional, not a fixed mandatory volume."], "RICA-BHA-BP1-1": ["Tracker period: 1 May 2026–30 Oct 2026; may be extended.", "Th function outcomeComparisons(g){
  const fmt=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(n);
  const change=g.latest-g.baseline, gap=g.latest-g.target;
  const lowerIsBetter=g.target<g.baseline;
  const improved=(lowerIsBetter?-change:change)>0;
  const unit=n=>g.suffix==='%'?`${fmt(n)} percentage points`:`${fmt(n)} ${n===1?'hour':'hours'}`;
  const improvement=change===0?'No change':g.baseline===0
    ?`${change>0?'+':'−'}${unit(Math.abs(change))}`
    :`${fmt(Math.abs(change/g.baseline)*100)}% ${improved?'improvement':'worse'} (${unit(Math.abs(change))} ${change<0?'lower':'higher'})`;
  const variance=gap===0?'Target met':g.target===0
    ?`${unit(Math.abs(gap))} ${gap<0?'below':'above'} target`
    :`${fmt(Math.abs(gap/g.target)*100)}% ${gap<0?'below':'above'} target (${unit(Math.abs(gap))})`;
  return `<div class="rh-outcome-comparisons"><p><span>From baseline:</span> <b>${improvement}</b>${g.baseline===0&&change!==0?'<small>Percentage change cannot be calculated from zero.</small>':''}</p><p><span>Target gap:</span> <b>${variance}</b></p></div>`;
}

ssumption.replace('solely for this fictional scenario','for this scenario').replace('in this fictional scenario','in this scenario'))}</small></section><p class="rh-small rh-muted" style="margin-top:8px">Sourced award evidence</p>${sourceList(a.sources)}${a.notes?.length?`<details><summary class="rh-expand cursor-interaction">Source notes</summary>${a.notes.map(n=>`<p class="rh-small">${esc(n)}</p>`).join('')}</details>`:''}</div></details>`;}
