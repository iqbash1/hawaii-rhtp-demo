function methodology(){return `<section class="rh-method"><h2>Sources & definitions</h2><p><b>Source facts:</b> Reviewed 14 Oct 2026. All 22 awardees, award dates and original full award values match official HANDS evidence: 17 records in the 28 Sep 2026 export and five live notices. Original RFPs, RFIs and purchase approvals verify scope, quantities and issuing offices. This is a selected collection, not the full RHTP portfolio or a check of later contract amendments.</p><p><b>Goals & agencies:</b> HAWAII GRANT APPL.pdf, preview dated 4 Nov 2025. Goal links: Table 6, PDF pp. 27–28. Targets: Table 10, pp. 61–63. Initiative leads: pp. 36, 40, 44, 50, 52, 55 and 88. State oversight: pp. 56–57. Application targets and lead arrangements need confirmation against the current approved framework.</p><p class="rh-demo"><b>Reporting period:</b> Results through 30 Sep 2028. Continued work on earlier awards assumes schedule extensions with no added award value.</p><p><b>Financial and delivery measures:</b> Award-detail payments and unpaid balances use each award’s stated RHTP basis; aggregate payments exclude unconfirmed shares. Annual recorded-award totals include only awards with source-supported initiative and budget-period attribution. Red payments and unpaid award balances are calculated from the same records. Unallocated awards remain separate. Delivery completion is measured separately from payments and initiative outcomes.</p><p><b>Financial counting:</b> Joint RHIN / RVBI awards remain unsplit and count once overall. Filtered RHIN and RVBI totals overlap. KupunAloha’s $2,550,000 full award is verified. Its $750,000 RHTP share and RRN mapping appear only in the internal tracker, so the share is excluded from verified RHTP financial totals. Its demo payment remains visible only in the award detail. An awarding office is distinct from the initiative lead and the federal funding source.</p><p><b>Awardee bios:</b> Concise descriptions from the organizations’ official websites, with entity checks where a brand and legal awardee differ. Published awardee organization addresses are distinct from project service and delivery areas. Location sources and qualifiers appear under each award’s source facts. Each profile links to its sources; Kuakini’s official subsidiary profile is archived. Bios describe the organization, not its performance on this award.</p><p><b>Coverage:</b> No Pili Ola or HOME RUN awards appear in this collection; this does not mean no funding or activity exists. Initiative outcomes are program-level measures, not totals attributable to these 22 awards. Island views use source-named service or delivery areas, not headquarters or verified reach. Statewide work without an island allocation is separate. Island counts overlap and must not be added.</p><p><b>Progress bars:</b> Each latest/target pair shares a zero-based scale. Bar lengths compare values, not a composite completion score. Service levels and equipment capacity are compared with their source standards, separately from completed outputs. Application targets are due FY2031; their gaps alone do not establish schedule status. Payment and delivery progress remain separate.</p><p><b>Scope coverage:</b> All 22 awards have a saved matching solicitation or purchase-approval source, summarized into ${scopeCount} goals. These summaries and proposed measures need confirmation against the executed contracts. Each award view cites its source PDF and pages. “On track” means scheduled master milestones are met; “Needs attention” means one is behind; “Delayed” means two or more are behind. Each output shows its gap to the plan due by the reporting date; service levels are compared with their source standard.</p><p><b>Map:</b> Published U.S. Census geography via <a href="https://github.com/topojson/us-atlas" target="_blank" rel="noopener">U.S. Atlas</a>, projected with D3. Outlines locate islands; shading is selection, not service coverage.</p>${sourceList(DATA.sources)}<p><a href="https://hands.ehawaii.gov/" target="_blank" rel="noopener">HANDS ↗</a> · <a href="https://rhtp.hawaii.gov/" target="_blank" rel="noopener">Hawaiʻi RHTP ↗</a></p></section>`;}

function awards(){

function comparePair({actual,target,actualLabel='Latest',targetLabel='Target',actualText,targetText,actualDemo=true,targetDemo=false,scaleMax}){

 const max=valid(scaleMax)&&scaleMax>0?scaleMax:Math.max(valid(actual)?Math.abs(actual):0,valid(target)?Math.abs(target):0,1);
 const column=(value,label,text,isDemo,kind)=>`<div class="rh-compare-column ${isDemo?'rh-demo':''}"><span class="rh-compare-label">${esc(label)}</span><strong>${esc(text??(valid(value)?num(value):'Not reported'))}</strong>${valid(value)?`<div class="rh-compare-track" aria-hidden="true"><span class="rh-compare-fill ${kind}" style="width:${Math.min(100,Math.max(0,value/max*100))}%"></span></div>`:'<div class="rh-compare-empty">No value available</div>'}</div>`;
 return `<div class="rh-compare-pair">${column(actual,actualLabel,actualText,actualDemo,'actual')}${column(target,targetLabel,targetText,targetDemo,'target')}</div>`;
}
function programGap(m){
 const gap=Math.abs(m.target-m.latest),pct=Math.abs((m.latest-m.target)/m.target*100);
 const amount=Number(gap.toFixed(2));
 const unit=m.unit.startsWith('percent')?' percentage points':m.unit==='workers'?(amount===1?' worker':' workers'):m.unit==='service years'?(amount===1?' service-year':' service-years'):(amount===1?' network':' networks');
 if(m.targetComparator==='<')return m.latest<m.target?'Below the target limit':`${amount===0?'At the limit; must be lower':num(amount)+unit+' above the limit'}${amount?' · '+num(Number(pct.toFixed(1)))+'% above target':''}`;
 if(m.latest>=m.target)return m.latest===m.target?'Target reached':num(amount)+unit+' beyond target';
 return num(amount)+unit+' to target · '+num(Number(pct.toFixed(1)))+'% below target';
}
function programComparison(m,shortGap=false,targetText=null,compactOverview=false){

 const latest=num(m.latest)+(wording[m.unit]||''),target=(limit?'below ':'')+num(m.target)+suffix;
 const maximum=limit?Math.max(m.latest,m.target)*1.25:m.target,fill=Math.min(100,Math.max(0,m.latest/maximum*100));
 const label=`${latest}; target ${target}. ${programGap(m)}${limit?'. Lower is better.':''}`;
 return `<div class="rh-program-comparison"><p class="rh-progress-label">${targetText?`Target: <b>${esc(targetText)}</b> ${compactOverview?'':`by ${esc(m.targetYear)}`}`:`<strong class="rh-demo">${esc(latest)}</strong><span>· target <b>${esc(target)}</b></span>`}</p><div class="rh-program-track${limit?' rh-limit-track':''}" role="img" aria-label="${esc(label)}"><span class="rh-program-fill" style="width:${fill}%"></span>${limit?`<span class="rh-program-limit" style="left:${m.target/maximum*100}%" aria-hidden="true"></span>`:''}</div>${compactOverview?'':`<p class="rh-small rh-demo rh-comparison-gap">${esc(shortGap?programGap(m).split(' · ')[0]:programGap(m))}${limit?' · Lower is better':''}</p>`}</div>`;
}

function programMeasure(id,layout='detail'){
 const compactOverview=layout==='overview';
 const m=metrics[id],c=measureCopy[id],i=INITIATIVES.find(i=>demoMetrics(i.id).some(m=>m.id===id));
 const statement=num(m.latest)+c.statement,target=(m.targetComparator==='<'?'below ':'')+num(m.target)+c.target;
 const date=new Date(m.reportingDate+'T12:00:00Z').toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'});
 const sourceBaseline={
  rvbi_cost_growth:'Application baseline: 4% annual growth in FY2025. Actual subsequent performance reports are not available in this collection.',
  rica_trauma_transfer_time:'Source context: air-medical transfers across Hawaiʻi averaged 274 minutes from dispatch to hospital arrival. This is not a verified baseline for every emergency and trauma transfer; the demo does not convert its reduction into minutes.',
  rhin_closed_loop_referrals:'Source context: the application cites a national referral-completion benchmark of about 35%. This is not a Hawaiʻi baseline; a comparable local numeric baseline is not established here.',
  rvbi_networks:'Source context: the application reports hospital-led accountable care organizations in four counties and FQHC-led organizations in two. These county counts are not a baseline count of the new rural networks tracked here.'
 };
 const baseline=sourceBaseline[id]||(m.unit==='percent reduction'||m.unit==='percent increase'?'The change is relative to baseline, not a percentage-point change in a rate. Numeric baseline observations are not available.':'Actual performance reports and numeric baseline observations are not available in this collection.');
 return `<article class="rh-overview-measure${compactOverview?' rh-overview-compact-measure':''}" data-program-metric="${esc(id)}"><div class="rh-measure-heading"><h3 class="rh-demo">${esc(statement)}</h3><p class="rh-small rh-muted">${esc(compactOverview?c.context.split(' · ').slice(0,-1).join(' · '):c.context)}${compactOverview?'':` · <span class="rh-demo">${esc(date)}</span>`}</p></div>${programComparison(m,true,target,compactOverview)}<details class="rh-definitions rh-measure-about"><summary class="cursor-interaction" aria-label="About this measure: ${esc(metricShort[id])}">${compactOverview?`<span class="rh-measure-gap rh-demo">${esc(programGap(m).split(' · ')[0])}</span>`:''}<span class="rh-measure-about-label">About this measure</span></summary><p><b>What it measures:</b> ${esc(c.definition)}</p><p><b>Why it matters:</b> ${esc(c.why)}</p><p><b>Responsible initiative:</b> ${esc(initiativeName(i))}.<br><b>Lead:</b> ${esc(publicInitiatives[i.id].lead)}.</p><p><b>Source:</b> Hawaiʻi grant application, November 2025, ${esc(m.targetSource.table)}, PDF p. ${esc(m.targetSource.pdfPage)}. This is an application target; confirm it against the current approved framework.</p><p>${esc(baseline)}</p><p class="rh-demo"><b>Compared with target:</b> ${esc(programGap(m))}. The latest result and reporting date are demo values.</p><p>Supporting awards show alignment with the program. They do not establish that a particular award caused this result.</p></details></article>`;
}

<script>
(() => {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set(["top", "right", "bottom", "left"]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) => {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest("[data-tooltip]");
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =>
    target?.nodeType != null && trigger.contains(target);
  const getContent = (trigger) =>
    trigger.getAttribute("data-tooltip")?.trim() ?? "";
  const getPlacement = (trigger) => {
    const placement = trigger.getAttribute("data-tooltip-placement");
    return tooltipPlacements.has(placement) ? placement : "top";
  };
  const getTooltip = () => {
    if (tooltip == null) {
      tooltip = document.createElement("div");
      tooltip.id = tooltipId;
      tooltip.className = "tooltip";
      tooltip.setAttribute("role", "tooltip");
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) => {
    const ids = new Set(
      (trigger.getAttribute("aria-describedby") ?? "")
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute("aria-describedby");
    } else {
      trigger.setAttribute("aria-describedby", [...ids].join(" "));
    }
  };
  const clearOpenTimeout = () => {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) => {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) => {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              "--tooltip-available-width",
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              "--tooltip-available-height",
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: "fixed",
    })
      .then(({ x, y }) => {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = "visible";
      })
      .catch(() => {
        if (activeTrigger === trigger && request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) => {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = "hidden";
    floating.style.transform = "translate(0, 0)";
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () => {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) => {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() < skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() => {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) => {
    if (event.pointerType === "touch") {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) => {
    lastPointerWasTouch =
      event.type === "pointerdown" && event.pointerType === "touch";
  };
  const handleTouchClick = (event) => {
    const isTouch = event.pointerType === "touch" || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch && activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() => {
      if (activeTrigger === trigger && !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) => {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) => {
    const trigger = getTrigger(event);
    if (trigger?.matches(":focus-visible")) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) => {
    if (event.key === "Escape") {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) => {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) => {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) => {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll("*")) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) => {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host && !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger && !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () => {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () => {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener("pagehide", destroy, { once: true });
})();
</script>
<script id="codex-visualization-tabs">
(() => {
  const selector = '.nav[role="tablist"] [role="tab"]';
  const disabled = ':disabled,[aria-disabled="true"]';
  const selectTab = (selected) => {
    const panelId = selected.getAttribute("aria-controls");
    for (const tab of selected.closest('[role="tablist"]').querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.classList.toggle("active", active);
      tab.setAttribute("aria-selected", String(active));
      const id = tab.getAttribute("aria-controls");
      const panel = id && document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden && selected.id) {
          panel.setAttribute("aria-labelledby", selected.id);
        }
      }
    }
  };
  const interact = (event) => {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === "click") {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest('[role="tablist"]').querySelectorAll('[role="tab"]'),
    ).filter((candidate) => !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === "ArrowRight" || event.key === "ArrowDown") {
      next = (current + 1) % tabs.length;
    } else if (event.key === "ArrowLeft" || event.key === "ArrowUp") {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === "Home") {
      next = 0;
    } else if (event.key === "End") {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll('.nav[role="tablist"]')) {
    const selected =
      list.querySelector('[role="tab"][aria-selected="true"]') ??
      list.querySelector('[role="tab"].active') ??
      list.querySelector('[role="tab"]');
    if (selected != null) {
      selectTab(selected);
    }
  }
  document.addEventListener("click", interact);
  document.addEventListener("keydown", interact);
  window.addEventListener("pagehide", () => {
    document.removeEventListener("click", interact);
    document.removeEventListener("keydown", interact);
  }, { once: true });
})();
</script>
<script id="codex-visualization-carousel">
  (() => {
    for (const root of document.querySelectorAll(".viz-carousel")) {
      const panels = Array.from(
        root.querySelectorAll(":scope > [data-variant]"),
      );
      if (panels.length === 0) {
        continue;
      }
      root.setAttribute("role", "group");
      panels.forEach((panel, index) => {
        panel.hidden = index !== 0;
        panel.setAttribute("role", "group");
        if (!panel.hasAttribute("aria-label")) {
          panel.setAttribute("aria-label", panel.dataset.variant);
        }
      });
      root.dataset.activeVariant = panels[0].dataset.variant;
      if (panels.length === 1) {
        continue;
      }

      const controls = document.createElement("div");
      controls.className = "viz-carousel-controls";
      // Portable copy of the settings dropdown's legacy glyph; no 14px icon-package preset matches it.
      // https://github.com/openai/openai/blob/master/codex/codex-apps/webview/src/icons/chevron.svg
      controls.innerHTML = `
      <button type="button" class="viz-carousel-previous cursor-interaction"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <details class="viz-carousel-picker">
        <summary class="cursor-interaction">
          <span class="viz-carousel-count tabular-nums"></span>
          <span class="viz-carousel-name"></span>
          <svg class="viz-carousel-caret" width="14" height="14" viewBox="0 0 20 21" fill="none" aria-hidden="true" focusable="false">
            <path d="M15.2793 7.71101C15.539 7.45131 15.961 7.45131 16.2207 7.71101C16.4804 7.97071 16.4804 8.39272 16.2207 8.65242L10.4707 14.4024C10.211 14.6621 9.78902 14.6621 9.52932 14.4024L3.77932 8.65242L3.69436 8.54792C3.52385 8.28979 3.55205 7.93828 3.77932 7.71101C4.00659 7.48374 4.3581 7.45554 4.61623 7.62605L4.72073 7.71101L10 12.9903L15.2793 7.71101Z" fill="currentColor" stroke="currentColor" stroke-width="0.6" />
          </svg>
        </summary>
        <div class="viz-carousel-options"></div>
      </details>
      <button type="button" class="viz-carousel-next cursor-interaction"><i data-lucide="chevron-right" aria-hidden="true"></i></button>`;
      const previous = controls.querySelector(".viz-carousel-previous");
      const next = controls.querySelector(".viz-carousel-next");
      const picker = controls.querySelector(".viz-carousel-picker");
      const summary = picker.querySelector("summary");
      const count = controls.querySelector(".viz-carousel-count");
      const name = controls.querySelector(".viz-carousel-name");
      const options = controls.querySelector(".viz-carousel-options");
      const status = document.createElement("span");
      status.className = "sr-only";
      status.setAttribute("role", "status");
      status.setAttribute("aria-live", "polite");
      status.setAttribute("aria-atomic", "true");
      previous.setAttribute(
        "aria-label",
        root.dataset.previousLabel ?? "Previous variant",
      );
      next.setAttribute("aria-label", root.dataset.nextLabel ?? "Next variant");

      let active = 0;
      let mousePointerId = null;
      let summaryPointerHandled = false;
      summary.addEventListener("pointerdown", (event) => {
        summaryPointerHandled =
          event.pointerType === "mouse" && event.button === 0 && !event.ctrlKey;
        if (!summaryPointerHandled) {
          return;
        }
        event.preventDefault();
        summary.focus({ preventScroll: true });
        picker.open = !picker.open;
        mousePointerId = picker.open ? event.pointerId : null;
      });
      summary.addEventListener("click", (event) => {
        if (summaryPointerHandled && event.detail > 0) {
          event.preventDefault();
        }
      });
      const choices = panels.map((panel, index) => {
        const choice = document.createElement("button");
        choice.type = "button";
        choice.className = "cursor-interaction";
        choice.textContent = panel.dataset.variant;
        choice.addEventListener("click", () => {
          select(index);
          summary.focus();
        });
        choice.addEventListener("pointerup", (event) => {
          if (
            picker.open &&
            event.pointerType === "mouse" &&
            event.button === 0 &&
            event.pointerId === mousePointerId
          ) {
            choice.click();
          }
        });
        options.appendChild(choice);
        return choice;
      });
      const select = (index) => {
        const changed = active !== index;
        active = index;
        panels.forEach((panel, position) => {
          panel.hidden = position !== active;
          choices[position].setAttribute(
            "aria-current",
            String(position === active),
          );
        });
        root.dataset.activeVariant = panels[active].dataset.variant;
        count.textContent = `${active + 1} / ${panels.length}`;
        name.textContent = panels[active].dataset.variant;
        picker.open = false;
        mousePointerId = null;
        if (changed) {
          status.textContent = `${count.textContent}: ${name.textContent}`;
        }
      };
      previous.addEventListener("click", () =>
        select((active + panels.length - 1) % panels.length),
      );

      );

          summary.focus();

        }
        if (event.altKey || event.ctrlKey || event.metaKey) {
          return;
        }
        const index = choices.indexOf(document.activeElement);
        let nextIndex;
        if (event.key === "ArrowDown") {
          nextIndex = index < 0 ? active : (index + 1) % choices.length;
        } else if (event.key === "ArrowUp") {
          nextIndex = index < 0 ? active : (index + choices.length - 1) % choices.length;
        } else if (picker.open && event.key === "Home") {
          nextIndex = 0;
        } else if (picker.open && event.key === "End") {
          nextIndex = choices.length - 1;
        } else {
          return;
        }
        event.preventDefault();
        picker.open = true;
        choices[nextIndex].focus();
      });
      picker.addEventListener("focusout", (event) => {
        if (!picker.contains(event.relatedTarget)) {
          picker.open = false;
          mousePointerId = null;
        }
      });
      const dismiss = (event) => {
        if (!summary.contains(event.target)) {
          mousePointerId = null;
        }
        if (!picker.contains(event.target)) {
          picker.open = false;
        }
      };
      const endPointerSelection = () => {
        mousePointerId = null;
      };
      const sizePicker = () => {
        root.style.setProperty(
          "--viz-carousel-picker-height",
          `${picker.open ? options.offsetHeight : 0}px`,
        );
      };
      picker.addEventListener("toggle", sizePicker);
      window.addEventListener("resize", sizePicker);
      document.addEventListener("pointerdown", dismiss);
      document.addEventListener("pointerup", endPointerSelection);
      document.addEventListener("pointercancel", endPointerSelection);
      window.addEventListener("blur", endPointerSelection);
      window.addEventListener(
        "pagehide",
        () => {
          document.removeEventListener("pointerdown", dismiss);
          document.removeEventListener("pointerup", endPointerSelection);
          document.removeEventListener("pointercancel", endPointerSelection);
          window.removeEventListener("blur", endPointerSelection);
          window.removeEventListener("resize", sizePicker);
        },
        { once: true },
      );
      root.append(controls, status);
      select(0);
    }
  })();
</script>
<script>
(() => {
  const initialize = () => {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById("codex-visualization-lucide")
    ?.addEventListener("load", initialize, { once: true });
})();
</script>
